name: GoREST API Automation Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'src/test/java/com/atait/assignment/api/**'
      - 'src/test/resources/features/api-tests/**'
      - 'src/main/java/com/atait/assignment/config/**'
      - 'pom.xml'
      - '.github/workflows/api-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/test/java/com/atait/assignment/api/**'
      - 'src/test/resources/features/api-tests/**'
      - 'src/main/java/com/atait/assignment/config/**'
      - 'pom.xml'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:
    inputs:
      cucumber_tags:
        description: 'Cucumber tag expression to execute'
        required: false
        default: '@gorest'
        type: string

permissions:
  contents: read

jobs:
  api-tests:
    name: Execute GoREST API Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Executable Permissions to Maven Wrapper
        run: chmod +x mvnw

      - name: Verify API Credentials Configured
        run: |
          if [ -z "${GOREST_API_TOKEN}" ]; then
            echo "::error::GOREST_API_TOKEN secret is missing! Please configure it in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
        env:
          GOREST_API_TOKEN: ${{ secrets.GOREST_API_TOKEN }}

      - name: Execute API Tests & Generate Serenity Reports
        env:
          GOREST_API_TOKEN: ${{ secrets.GOREST_API_TOKEN }}
        run: |
          TAG_FILTER="${{ github.event.inputs.cucumber_tags || '@gorest' }}"
          echo "Running API tests with tag filter: ${TAG_FILTER}"
          ./mvnw clean verify "-Dcucumber.filter.tags=${TAG_FILTER}"

      - name: Upload Serenity Living Documentation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-living-documentation
          path: target/site/serenity/
          retention-days: 14

      - name: Upload Cucumber HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: target/cucumber-reports/
          retention-days: 14
