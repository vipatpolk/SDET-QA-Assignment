name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      cucumber_tags:
        description: 'Cucumber tag filter expression (e.g., @ui, @gorest, @smoke)'
        required: false
        default: '@ui or @gorest'
        type: string

permissions:
  contents: read

jobs:
  ui-tests:
    name: UI Automation Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant Executable Permissions to Maven Wrapper
        run: chmod +x mvnw

      - name: Install Playwright Browsers & OS Dependencies
        run: ./mvnw exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

      - name: Execute UI Tests & Aggregate Serenity Report
        run: ./mvnw clean verify "-Dcucumber.filter.tags=@ui"

      - name: Upload Serenity UI Living Documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-ui-report
          path: target/site/serenity/
          retention-days: 14

      - name: Upload Cucumber UI HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-ui-report
          path: target/cucumber-reports/
          retention-days: 14

  api-tests:
    name: API Automation Tests (REST Assured & SerenityRest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant Executable Permissions to Maven Wrapper
        run: chmod +x mvnw

      - name: Validate API Credentials Secret
        run: |
          if [ -z "${GOREST_API_TOKEN}" ]; then
            echo "::error::GOREST_API_TOKEN is missing. Please add it to GitHub Secrets."
            exit 1
          fi
        env:
          GOREST_API_TOKEN: ${{ secrets.GOREST_API_TOKEN }}

      - name: Execute API Tests & Aggregate Serenity Report
        env:
          GOREST_API_TOKEN: ${{ secrets.GOREST_API_TOKEN }}
        run: ./mvnw clean verify "-Dcucumber.filter.tags=@gorest"

      - name: Upload Serenity API Living Documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-api-report
          path: target/site/serenity/
          retention-days: 14

      - name: Upload Cucumber API HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-api-report
          path: target/cucumber-reports/
          retention-days: 14
